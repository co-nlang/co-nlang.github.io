name: Deploy to GitHub Pages

on:
  push:
    branches: [top]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# The engine the site's snippets are verified against. Bump deliberately: the
# footer stamp is derived from whatever this build actually ran.
env:
  OO_TAG: v0.26.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # ── Honesty gate ──────────────────────────────────────────────────
      # Every `;; → X` on the site must reproduce on a real oo engine. The gate
      # derives its cases from src/i18n/landing.ts, so a snippet cannot be
      # uncovered, and it writes the receipt the footer's stamp is built from.
      # A failure here fails the deploy — that is the whole point of it.
      - name: Check out the engine
        uses: actions/checkout@v4
        with:
          repository: co-nlang/nlang-tools
          ref: ${{ env.OO_TAG }}
          path: .engine
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .engine
      - name: Build oo
        run: cargo build --release -p oo --bin oo --manifest-path .engine/Cargo.toml
      - name: Verify every n/ snippet
        run: OO_BIN="$PWD/.engine/target/release/oo" npm run verify:snippets

      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
